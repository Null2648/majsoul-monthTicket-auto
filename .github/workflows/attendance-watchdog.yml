name: Attendance Watchdog

on:
  schedule:
    - cron: '31 11-14 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/attendance-watchdog.yml'
      - '.github/workflows/main.yml'
      - 'scripts/dispatch-attendance-watchdog.js'
      - 'src/attendance-schedule.js'
      - 'test/attendance-schedule.test.js'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate watchdog policy
        run: node --test test/attendance-schedule.test.js

  dispatch:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: majsoul-attendance-watchdog
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Check success marker and dispatch recovery
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/dispatch-attendance-watchdog.js last-attendance-kst.txt
