name: Apply Forced Client Refresh

on:
  push:
    branches:
      - agent/repair-update-resilience
    paths:
      - '.github/workflows/apply-forced-client-refresh.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/repair-update-resilience
          fetch-depth: 0

      - name: Apply forced-refresh patch
        run: python3 scripts/apply-forced-client-refresh-fix.py

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run regression suite
        run: npm test

      - name: Remove temporary patch helpers
        shell: bash
        run: |
          rm -f scripts/apply-forced-client-refresh-fix.py
          rm -f .github/workflows/apply-forced-client-refresh.yml

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Force-refresh client metadata after version exhaustion'
          git pull --rebase origin agent/repair-update-resilience
          git push origin HEAD:agent/repair-update-resilience
