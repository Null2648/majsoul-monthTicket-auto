name: Apply Update Resilience Fix

on:
  push:
    branches:
      - agent/repair-update-resilience
    paths:
      - '.github/workflows/apply-update-resilience-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/repair-update-resilience
          fetch-depth: 0

      - name: Apply deterministic compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text()
              updated, count = re.subn(pattern, lambda _: replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: expected one regex match, found {count}: {pattern[:80]}')
              p.write_text(updated)

          regex_once(
              'src/index.js',
              r"function isVersionStringError\(error\) \{.*?\n\}\n\nfunction buildRoutesUrl",
              r'''function getRpcErrorMessage(error) {
            return String(
              error?.response?.error?.message ||
              error?.message ||
              error ||
              ''
            );
          }

          function isVersionStringError(error) {
            const message = getRpcErrorMessage(error);
            return (
              /version[_\s-]*(?:str|string)/i.test(message) ||
              /client[_\s-]*version/i.test(message) ||
              /ERR_CLIENT_VERSION/i.test(message)
            );
          }

          function isClientVersionProbeError(error) {
            return (
              isVersionStringError(error) ||
              (
                error instanceof MajsoulRpcError &&
                (error.operation === 'oauth2Auth' || error.operation === 'oauth2Login') &&
                error.rpcCode === 150
              )
            );
          }

          function isConnectionQueueError(error) {
            return (
              error instanceof MajsoulRpcError &&
              error.operation === 'oauth2Auth' &&
              error.rpcCode === 151 &&
              !isClientVersionProbeError(error)
            );
          }

          function buildRoutesUrl'''
          )

          regex_once(
              'src/index.js',
              r"  let detectedClientVersionStrings = \[\];\n\n  if \(cacheIsCurrent\) \{.*?\n  \}\n\n  const clientVersionStringCandidates =",
              r'''  const detectedClientVersionStrings = resolveClientVersionStrings({
            productVersion
          });

            if (cacheIsCurrent) {
              console.log(
                'client metadata unchanged -> using the last successful cached settings first; current Unity metadata remains armed as fallback'
              );
            } else {
              console.log('client metadata update detected -> refreshing official version sources');
            }

            const clientVersionStringCandidates ='''
          )

          regex_once(
              'src/index.js',
              r"  error\.yostarAuthRejected = errors\.some\(.*?\n  error\.retryable = false;",
              r'''  error.code = 'CLIENT_VERSION_CANDIDATES_EXHAUSTED';
            error.clientVersionCandidatesExhausted = true;
            // Every captured failure here was already classified as a client-version
            // mismatch. Do not reinterpret code 151 as an expired YoStar credential.
            error.yostarAuthRejected = false;
            error.retryable = false;'''
          )

          regex_once(
              'src/index.js',
              r"  getServerConfig,\n  getClientVersionStringCandidates,\n  isConnectionQueueError,",
              r'''  getServerConfig,
            getClientVersionStringCandidates,
            getRpcErrorMessage,
            isConnectionQueueError,'''
          )

          regex_once(
              'src/official-client-version.js',
              r"function mergeDiscoveredClientVersionStrings\(options = \{\}, discoveredStrings = \[\]\) \{.*?\n\}\n\nfunction installOfficialClientVersionStrings",
              r'''function mergeDiscoveredClientVersionStrings(options = {}, discoveredStrings = []) {
            return {
              ...options,
              detectedClientVersionStrings: [
                // Current Unity product/build metadata is the strongest first candidate
                // after an update. JavaScript-derived strings remain immediate fallbacks.
                ...(options.detectedClientVersionStrings || []),
                ...discoveredStrings
              ]
            };
          }

          function installOfficialClientVersionStrings'''
          )
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run regression suite
        run: npm test

      - name: Remove temporary repair helpers
        shell: bash
        run: |
          rm -f scripts/update-probe.js
          rm -f .github/workflows/inspect-latest-attendance.yml
          rm -f .github/workflows/apply-update-resilience-fix.yml

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A -- src/index.js src/official-client-version.js test/client-version-update-resilience.test.js scripts/update-probe.js .github/workflows/inspect-latest-attendance.yml .github/workflows/apply-update-resilience-fix.yml
          git commit -m 'Repair automatic client-version recovery'
          git push origin HEAD:agent/repair-update-resilience
