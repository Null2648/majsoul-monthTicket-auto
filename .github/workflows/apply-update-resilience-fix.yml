name: Apply Update Resilience Fix

on:
  push:
    branches:
      - agent/repair-update-resilience
    paths:
      - '.github/workflows/apply-update-resilience-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/repair-update-resilience
          fetch-depth: 0

      - name: Apply deterministic compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once('src/index.js', '''function isVersionStringError(error) {
            const message = error?.message || String(error);
            return (
              message.includes('version_str') ||
              message.includes('client_version_string')
            );
          }

          function isClientVersionProbeError(error) {
            return (
              isVersionStringError(error) ||
              (
                error instanceof MajsoulRpcError &&
                error.operation === 'oauth2Auth' &&
                error.rpcCode === 150
              )
            );
          }

          function isConnectionQueueError(error) {
            return (
              error instanceof MajsoulRpcError &&
              error.operation === 'oauth2Auth' &&
              error.rpcCode === 151
            );
          }
          ''', '''function getRpcErrorMessage(error) {
            return String(
              error?.response?.error?.message ||
              error?.message ||
              error ||
              ''
            );
          }

          function isVersionStringError(error) {
            const message = getRpcErrorMessage(error);
            return (
              /version[_\\s-]*(?:str|string)/i.test(message) ||
              /client[_\\s-]*version/i.test(message) ||
              /ERR_CLIENT_VERSION/i.test(message)
            );
          }

          function isClientVersionProbeError(error) {
            return (
              isVersionStringError(error) ||
              (
                error instanceof MajsoulRpcError &&
                (error.operation === 'oauth2Auth' || error.operation === 'oauth2Login') &&
                error.rpcCode === 150
              )
            );
          }

          function isConnectionQueueError(error) {
            return (
              error instanceof MajsoulRpcError &&
              error.operation === 'oauth2Auth' &&
              error.rpcCode === 151 &&
              !isClientVersionProbeError(error)
            );
          }
          ''')

          replace_once('src/index.js', '''  let detectedClientVersionStrings = [];

            if (cacheIsCurrent) {
              console.log('client metadata unchanged -> using the last successful cached settings');
            } else {
              console.log('client metadata update detected -> refreshing official version sources');
              detectedClientVersionStrings = resolveClientVersionStrings({
                productVersion
              });
            }
          ''', '''  const detectedClientVersionStrings = resolveClientVersionStrings({
            productVersion
          });

            if (cacheIsCurrent) {
              console.log(
                'client metadata unchanged -> using the last successful cached settings first; current Unity metadata remains armed as fallback'
              );
            } else {
              console.log('client metadata update detected -> refreshing official version sources');
            }
          ''')

          replace_once('src/index.js', '''  error.yostarAuthRejected = errors.some(
            candidate =>
              candidate.operation === 'oauth2Auth' &&
              candidate.rpcCode === 151
          );
            error.retryable = false;
          ''', '''  error.code = 'CLIENT_VERSION_CANDIDATES_EXHAUSTED';
            error.clientVersionCandidatesExhausted = true;
            // Reaching this aggregate means every captured failure was already classified
            // as a client-version mismatch. Do not misclassify it as expired YoStar auth.
            error.yostarAuthRejected = false;
            error.retryable = false;
          ''')

          replace_once('src/index.js', '''  getServerConfig,
            getClientVersionStringCandidates,
            isConnectionQueueError,
          ''', '''  getServerConfig,
            getClientVersionStringCandidates,
            getRpcErrorMessage,
            isConnectionQueueError,
          ''')

          replace_once('src/official-client-version.js', '''    detectedClientVersionStrings: [
              ...discoveredStrings,
              ...(options.detectedClientVersionStrings || [])
            ]
          ''', '''    detectedClientVersionStrings: [
              // The current Unity product/build metadata is the strongest first candidate
              // after an update. JavaScript-derived resource hints remain immediate fallbacks.
              ...(options.detectedClientVersionStrings || []),
              ...discoveredStrings
            ]
          ''')

          for temporary in [
              Path('scripts/update-probe.js'),
              Path('.github/workflows/inspect-latest-attendance.yml'),
              Path('.github/workflows/apply-update-resilience-fix.yml'),
          ]:
              if temporary.exists():
                  temporary.unlink()
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run regression suite
        run: npm test

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/index.js src/official-client-version.js test/client-version-update-resilience.test.js scripts/update-probe.js .github/workflows/inspect-latest-attendance.yml .github/workflows/apply-update-resilience-fix.yml || true
          git commit -m 'Repair automatic client-version recovery'
          git push origin HEAD:agent/repair-update-resilience
