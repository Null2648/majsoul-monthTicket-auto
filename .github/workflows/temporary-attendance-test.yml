name: Temporary Attendance Test
run-name: Temporary Attendance Test · ${{ github.event_name }}

on:
  schedule:
    # One-time verification target: 2026-07-28 14:45 KST (05:45 UTC).
    - cron: '45 5 28 7 *'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Dispatch the real attendance workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${REPOSITORY}/actions/workflows/main.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main","inputs":{"confirm_not_playing":"true","force":"true"}}'
          echo 'Temporary scheduled event dispatched Login to Majsoul on main.' >> "${GITHUB_STEP_SUMMARY}"
