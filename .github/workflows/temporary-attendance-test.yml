name: Temporary Attendance Test
run-name: Temporary Attendance Test · automatic push trigger

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporary-attendance-test.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Dispatch the real attendance workflow automatically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.github.com/repos/${REPOSITORY}/actions/workflows/main.yml/dispatches" \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data '{"ref":"main","inputs":{"confirm_not_playing":"true","force":"true"}}'
          echo 'Automatically dispatched Login to Majsoul on main.' >> "${GITHUB_STEP_SUMMARY}"
