name: Login to Majsoul

on:
  schedule:
    - cron: '7,22,37,52 6-10 * * *'
      timezone: 'Asia/Seoul'
    - cron: '13 12 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run even when attendance already succeeded today'
        required: false
        default: true
        type: boolean
      source:
        description: 'Dispatch source'
        required: false
        default: 'manual'
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main.yml'
      - '.github/workflows/attendance-watchdog.yml'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'protocol-snapshot.json'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/main.yml'
      - '.github/workflows/attendance-watchdog.yml'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'protocol-snapshot.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: majsoul-validation-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > npm-audit.json
          status=$?
          set -e
          cat npm-audit.json
          exit "${status}"

      - name: Upload dependency audit report
        if: failure() && hashFiles('npm-audit.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-report-${{ github.run_id }}
          path: npm-audit.json
          retention-days: 14

      - name: Run tests
        run: npm test

      - name: Check current JP client metadata
        run: npm run check:jp

      - name: Upload JP metadata diagnostic
        if: failure() && hashFiles('jp-metadata-diagnostic.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jp-metadata-diagnostic-${{ github.run_id }}
          path: jp-metadata-diagnostic.json
          retention-days: 7

      - name: Check current YoStar WebSDK metadata
        run: npm run check:yostar

      - name: Validate current protocol contract
        run: npm run check:protocol -- --write-baseline

      - name: Upload generated protocol snapshot
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-protocol-snapshot
          path: protocol-snapshot.json
          retention-days: 3

      - name: Upload protocol change report
        if: failure() && hashFiles('protocol-change-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-change-report
          path: protocol-change-report.json
          retention-days: 14

  attendance:
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: majsoul-attendance
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Decide whether attendance is needed
        id: decision
        shell: bash
        env:
          ATTENDANCE_SCHEDULE: ${{ github.event.schedule }}
          ATTENDANCE_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          marker="${RUNNER_TEMP}/last-attendance-kst.txt"
          git fetch origin main:refs/remotes/origin/main --quiet
          git show refs/remotes/origin/main:last-attendance-kst.txt > "${marker}" 2>/dev/null || :
          node src/attendance-schedule.js "${marker}"

      - name: Install dependencies
        if: steps.decision.outputs.should_run == 'true'
        run: npm ci

      - name: Run tests
        id: tests
        if: steps.decision.outputs.should_run == 'true'
        run: npm test

      - name: Execute month ticket automation
        id: automation
        if: steps.decision.outputs.should_run == 'true'
        run: npm start
        env:
          UID: ${{ secrets.UID }}
          TOKEN: ${{ secrets.TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          YOSTAR_DEVICE_ID: ${{ secrets.YOSTAR_DEVICE_ID }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          MS_SERVER: ${{ secrets.MS_SERVER }}

      - name: Update Keep-Alive and Runtime Cache
        id: cache
        if: success() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Last run: $(date --iso-8601=seconds)" > keep_alive.txt
          TZ=Asia/Seoul date +%F > last-attendance-kst.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add keep_alive.txt last-attendance-kst.txt resource-version.json auth-cache.json protocol-snapshot.json
          git diff --cached --quiet || git commit -m "Update runtime cache [skip ci]"

          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          trap 'git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true' EXIT
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload automation failure diagnostics
        if: >-
          always() &&
          steps.decision.outputs.should_run == 'true' &&
          (hashFiles('automation-failure-report.json') != '' ||
          hashFiles('protocol-change-report.json') != '')
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automation-failure-diagnostics-${{ github.run_id }}
          path: |
            automation-failure-report.json
            protocol-change-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Report automation status
        if: >-
          always() &&
          (steps.decision.outputs.should_run == 'true' || steps.decision.outcome == 'failure')
        continue-on-error: true
        run: node scripts/report-automation-status.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          JP_OUTCOME: skipped
          YOSTAR_OUTCOME: skipped
          PROTOCOL_OUTCOME: skipped
          AUTOMATION_OUTCOME: ${{ steps.automation.outcome }}
          CACHE_OUTCOME: ${{ steps.cache.outcome }}
          ATTENDANCE_STAGE: ${{ steps.decision.outputs.stage }}
          ATTENDANCE_SOURCE: ${{ inputs.source }}
