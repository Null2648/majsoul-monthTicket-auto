name: Login to Majsoul
run-name: >-
  Login to Majsoul · ${{ github.event_name == 'workflow_dispatch' && 'manual' || github.event_name }} · ${{ github.ref_name }}

on:
  schedule:
    - cron: '7,17 6 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      confirm_not_playing:
        description: '현재 게임에 접속 중이 아니며 중복 로그인으로 기존 세션이 종료될 수 있음을 확인'
        required: true
        default: false
        type: boolean
      force:
        description: '오늘 이미 성공했어도 다시 실행'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main.yml'
      - '.github/workflows/attendance-watchdog.yml'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'protocol-snapshot.json'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/main.yml'
      - '.github/workflows/attendance-watchdog.yml'
      - 'scripts/**'
      - 'src/**'
      - 'test/**'
      - 'protocol-snapshot.json'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: majsoul-validation-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > npm-audit.json
          status=$?
          set -e
          cat npm-audit.json
          exit "${status}"

      - name: Upload dependency audit report
        if: failure() && hashFiles('npm-audit.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit-report-${{ github.run_id }}
          path: npm-audit.json
          retention-days: 14

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee npm-test.log

      - name: Upload test failure log
        if: failure() && hashFiles('npm-test.log') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-test-log-${{ github.run_id }}
          path: npm-test.log
          retention-days: 7

      - name: Check current JP client metadata
        run: npm run check:jp

      - name: Upload JP metadata diagnostic
        if: failure() && hashFiles('jp-metadata-diagnostic.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jp-metadata-diagnostic-${{ github.run_id }}
          path: jp-metadata-diagnostic.json
          retention-days: 7

      - name: Check current YoStar WebSDK metadata
        run: npm run check:yostar

      - name: Validate current protocol contract
        run: npm run check:protocol -- --write-baseline

      - name: Upload generated protocol snapshot
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-protocol-snapshot
          path: protocol-snapshot.json
          retention-days: 3

      - name: Upload protocol change report
        if: failure() && hashFiles('protocol-change-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: protocol-change-report
          path: protocol-change-report.json
          retention-days: 14

  manual_ref_check:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - name: Verify manual run safety
        shell: bash
        env:
          SAFE_LOGIN_CONFIRMED: ${{ inputs.confirm_not_playing }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != 'refs/heads/main' ]]; then
            echo "::error title=main 브랜치를 선택하세요::수동 출석은 계정 Secret 보호를 위해 main 브랜치에서만 실행됩니다. Run workflow 창의 Use workflow from을 main으로 바꾼 뒤 다시 실행하세요."
            {
              echo '## 수동 실행이 시작되지 않은 이유'
              echo
              echo "선택된 ref: \`${GITHUB_REF}\`"
              echo
              echo '수동 출석은 계정 Secret 보호를 위해 `main` 브랜치에서만 실행됩니다.'
              echo '`Run workflow` 창의 `Use workflow from`을 `main`으로 선택한 뒤 다시 실행하세요.'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if [[ "${SAFE_LOGIN_CONFIRMED}" != 'true' ]]; then
            echo "::error title=현재 접속 상태를 확인하세요::자동화 로그인은 이미 접속 중인 게임 세션을 종료할 수 있습니다. 게임에서 로그아웃한 뒤 안전 확인 항목을 켜고 다시 실행하세요."
            {
              echo '## 수동 실행이 차단된 이유'
              echo
              echo '자동화 로그인은 이미 접속 중인 게임 세션을 종료할 수 있습니다.'
              echo '게임에서 로그아웃한 상태를 확인하고 `현재 게임에 접속 중이 아님` 항목을 켠 뒤 다시 실행하세요.'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          echo '수동 실행 안전 확인 완료: main / 현재 게임 미접속 확인' >> "${GITHUB_STEP_SUMMARY}"

  attendance:
    needs: manual_ref_check
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && needs.manual_ref_check.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: majsoul-attendance
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Decide whether attendance is safe and needed
        id: decision
        shell: bash
        env:
          ATTENDANCE_SCHEDULE: ${{ github.event.schedule }}
          ATTENDANCE_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          ATTENDANCE_CONFIRM_SAFE_LOGIN: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_not_playing || false }}
          ATTENDANCE_SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: |
          set -euo pipefail
          marker="${RUNNER_TEMP}/last-attendance-kst.txt"
          git fetch origin main:refs/remotes/origin/main --quiet
          git show refs/remotes/origin/main:last-attendance-kst.txt > "${marker}" 2>/dev/null || :
          node src/attendance-schedule.js "${marker}"

      - name: Validate attendance configuration
        id: preflight
        if: steps.decision.outputs.should_run == 'true'
        run: node scripts/preflight-attendance.js
        env:
          MAJSOUL_UID: ${{ secrets.UID }}
          MAJSOUL_TOKEN: ${{ secrets.TOKEN }}
          MAJSOUL_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          MAJSOUL_YOSTAR_DEVICE_ID: ${{ secrets.YOSTAR_DEVICE_ID }}
          MAJSOUL_EMAIL: ${{ secrets.EMAIL }}
          MAJSOUL_PASSWORD: ${{ secrets.PASSWORD }}
          MS_SERVER: ${{ secrets.MS_SERVER }}

      - name: Install runtime dependencies
        id: install
        if: steps.decision.outputs.should_run == 'true' && steps.preflight.outcome == 'success'
        run: npm ci --omit=dev --ignore-scripts

      - name: Execute month ticket automation
        id: automation
        if: >-
          steps.decision.outputs.should_run == 'true' &&
          steps.preflight.outcome == 'success' &&
          steps.install.outcome == 'success'
        run: npm start
        env:
          UID: ${{ secrets.UID }}
          TOKEN: ${{ secrets.TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          YOSTAR_DEVICE_ID: ${{ secrets.YOSTAR_DEVICE_ID }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          MS_SERVER: ${{ secrets.MS_SERVER }}

      - name: Update successful attendance state
        id: cache
        if: success() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Last run: $(date --iso-8601=seconds)" > keep_alive.txt
          TZ=Asia/Seoul date +%F > last-attendance-kst.txt

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keep_alive.txt last-attendance-kst.txt resource-version.json auth-cache.json protocol-snapshot.json
          git diff --cached --quiet || git commit -m 'Update runtime cache [skip ci]'

          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          trap 'git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true' EXIT
          git pull --rebase origin main
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Write attendance run report
        if: always()
        run: node scripts/write-attendance-run-report.js
        env:
          JOB_STATUS: ${{ job.status }}
          DECISION_OUTCOME: ${{ steps.decision.outcome }}
          SHOULD_RUN: ${{ steps.decision.outputs.should_run }}
          DECISION_REASON: ${{ steps.decision.outputs.reason }}
          ATTENDANCE_STAGE: ${{ steps.decision.outputs.stage }}
          ATTENDANCE_SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          ATTENDANCE_TODAY: ${{ steps.decision.outputs.today }}
          LAST_SUCCESS: ${{ steps.decision.outputs.last_success }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUTOMATION_OUTCOME: ${{ steps.automation.outcome }}
          CACHE_OUTCOME: ${{ steps.cache.outcome }}

      - name: Upload manual or failed run diagnostics
        if: always() && (github.event_name == 'workflow_dispatch' || job.status != 'success')
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: attendance-diagnostics-${{ github.run_id }}
          path: |
            attendance-run-report.json
            automation-failure-report.json
            protocol-change-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Report automation status
        if: >-
          always() &&
          (steps.decision.outputs.should_run == 'true' || steps.decision.outcome == 'failure')
        continue-on-error: true
        run: node scripts/report-automation-status.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TESTS_OUTCOME: skipped
          JP_OUTCOME: skipped
          YOSTAR_OUTCOME: skipped
          PROTOCOL_OUTCOME: skipped
          AUTOMATION_OUTCOME: ${{ steps.automation.outcome }}
          CACHE_OUTCOME: ${{ steps.cache.outcome }}
          ATTENDANCE_STAGE: ${{ steps.decision.outputs.stage }}
          ATTENDANCE_SOURCE: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
