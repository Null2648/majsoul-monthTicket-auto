name: Review upstream updates

on:
  schedule:
    - cron: '20 8 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/upstream-sync.yml'
      - 'scripts/upstream-sync-report.js'
      - 'test/upstream-sync-report.test.js'

concurrency:
  group: upstream-sync-${{ github.repository }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: 4n3u/majsoul-monthTicket-auto
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: automation/upstream-sync

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      has_updates: ${{ steps.discover.outputs.has_updates }}
      upstream_sha: ${{ steps.discover.outputs.upstream_sha }}
      base_sha: ${{ steps.discover.outputs.base_sha }}
      merge_result: ${{ steps.merge.outputs.result }}
      candidate_sha: ${{ steps.merge.outputs.candidate_sha }}
      validation_passed: ${{ steps.assess.outputs.passed }}
      install_outcome: ${{ steps.install.outcome }}
      unit_outcome: ${{ steps.unit.outcome }}
      jp_outcome: ${{ steps.jp.outcome }}
      yostar_outcome: ${{ steps.yostar.outcome }}
      protocol_outcome: ${{ steps.protocol.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Validate sync automation source
        run: |
          npm ci
          node --test test/upstream-sync-report.test.js

      - name: Preserve trusted report generator
        shell: bash
        run: cp scripts/upstream-sync-report.js "${RUNNER_TEMP}/upstream-sync-report.js"

      - name: Discover upstream changes
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/upstream-sync-result"
          mkdir -p "${artifact_dir}"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          git fetch --no-tags origin main

          upstream_ref="upstream/${UPSTREAM_BRANCH}"
          upstream_sha="$(git rev-parse "${upstream_ref}")"
          base_sha="$(git rev-parse origin/main)"
          echo "upstream_sha=${upstream_sha}" >> "${GITHUB_OUTPUT}"
          echo "base_sha=${base_sha}" >> "${GITHUB_OUTPUT}"

          git log --format='- `%h` %s' --max-count=50 "origin/main..${upstream_ref}" \
            > "${artifact_dir}/upstream-commits.md"
          git diff --name-only "origin/main...${upstream_ref}" \
            | head -100 \
            | awk '{ print "- `" $0 "`" }' \
            > "${artifact_dir}/upstream-files.md"

          if git merge-base --is-ancestor "${upstream_ref}" origin/main; then
            echo 'has_updates=false' >> "${GITHUB_OUTPUT}"
            echo 'No upstream commits are missing from the fork.'
          else
            echo 'has_updates=true' >> "${GITHUB_OUTPUT}"
            echo "Upstream changes detected at ${upstream_sha}."
          fi

      - name: Merge upstream into review candidate
        id: merge
        if: steps.discover.outputs.has_updates == 'true'
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/upstream-sync-result"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "${SYNC_BRANCH}" origin/main

          set +e
          git merge --no-ff --no-edit "upstream/${UPSTREAM_BRANCH}" \
            > "${artifact_dir}/merge.log" 2>&1
          merge_code=$?
          set -e

          if [[ ${merge_code} -ne 0 ]]; then
            git diff --name-only --diff-filter=U \
              | head -100 \
              | awk '{ print "- `" $0 "`" }' \
              > "${artifact_dir}/conflict-files.md"
            git merge --abort || true
            echo 'result=conflict' >> "${GITHUB_OUTPUT}"
            echo 'candidate_sha=' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          candidate_sha="$(git rev-parse HEAD)"
          echo 'result=success' >> "${GITHUB_OUTPUT}"
          echo "candidate_sha=${candidate_sha}" >> "${GITHUB_OUTPUT}"

      - name: Create immutable candidate Git bundle
        if: steps.merge.outputs.result == 'success'
        shell: bash
        run: |
          git bundle create \
            "${RUNNER_TEMP}/upstream-sync-result/candidate.bundle" \
            "refs/heads/${SYNC_BRANCH}"

      - name: Install candidate dependencies
        id: install
        if: steps.merge.outputs.result == 'success'
        continue-on-error: true
        run: npm ci

      - name: Run candidate unit tests
        id: unit
        if: steps.merge.outputs.result == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm test

      - name: Check candidate JP client metadata
        id: jp
        if: steps.merge.outputs.result == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run check:jp

      - name: Check candidate YoStar WebSDK metadata
        id: yostar
        if: steps.merge.outputs.result == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run check:yostar

      - name: Check candidate protocol contract
        id: protocol
        if: steps.merge.outputs.result == 'success' && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          if [[ -f protocol-snapshot.json ]]; then
            npm run check:protocol
          else
            npm run check:protocol -- --write-baseline
          fi

      - name: Assess candidate validation
        id: assess
        if: always() && steps.merge.outputs.result == 'success'
        env:
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          UNIT_OUTCOME: ${{ steps.unit.outcome }}
          JP_OUTCOME: ${{ steps.jp.outcome }}
          YOSTAR_OUTCOME: ${{ steps.yostar.outcome }}
          PROTOCOL_OUTCOME: ${{ steps.protocol.outcome }}
        shell: bash
        run: |
          passed=true
          for outcome in \
            "${INSTALL_OUTCOME}" \
            "${UNIT_OUTCOME}" \
            "${JP_OUTCOME}" \
            "${YOSTAR_OUTCOME}" \
            "${PROTOCOL_OUTCOME}"; do
            if [[ "${outcome}" != 'success' ]]; then
              passed=false
            fi
          done
          echo "passed=${passed}" >> "${GITHUB_OUTPUT}"

      - name: Upload upstream validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-sync-result
          path: ${{ runner.temp }}/upstream-sync-result
          if-no-files-found: warn
          retention-days: 7

      - name: Fail pull-request validation on conflict or test failure
        if: >-
          github.event_name == 'pull_request' &&
          steps.discover.outputs.has_updates == 'true' &&
          (steps.merge.outputs.result != 'success' || steps.assess.outputs.passed != 'true')
        run: exit 1

  publish:
    needs: validate
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
      statuses: write

    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download upstream validation result
        uses: actions/download-artifact@v5
        with:
          name: upstream-sync-result
          path: ${{ runner.temp }}/upstream-sync-result

      - name: Publish candidate branch
        id: push
        if: >-
          needs.validate.has_updates == 'true' &&
          needs.validate.merge_result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          bundle="${RUNNER_TEMP}/upstream-sync-result/candidate.bundle"
          git fetch "${bundle}" \
            "refs/heads/${SYNC_BRANCH}:refs/heads/${SYNC_BRANCH}"
          git fetch --no-tags origin \
            "${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" 2>/dev/null || true
          git push --force-with-lease origin \
            "refs/heads/${SYNC_BRANCH}:refs/heads/${SYNC_BRANCH}"

      - name: Assess published validation status
        id: status
        if: needs.validate.has_updates == 'true'
        env:
          MERGE_RESULT: ${{ needs.validate.merge_result }}
          VALIDATION_PASSED: ${{ needs.validate.validation_passed }}
        shell: bash
        run: |
          if [[ "${MERGE_RESULT}" == 'success' && "${VALIDATION_PASSED}" == 'true' ]]; then
            echo 'state=success' >> "${GITHUB_OUTPUT}"
            echo 'reason=validated' >> "${GITHUB_OUTPUT}"
          elif [[ "${MERGE_RESULT}" == 'conflict' ]]; then
            echo 'state=failure' >> "${GITHUB_OUTPUT}"
            echo 'reason=merge-conflict' >> "${GITHUB_OUTPUT}"
          else
            echo 'state=failure' >> "${GITHUB_OUTPUT}"
            echo 'reason=validation-failed' >> "${GITHUB_OUTPUT}"
          fi

      - name: Create or update draft review PR
        id: pr
        if: >-
          needs.validate.has_updates == 'true' &&
          needs.validate.merge_result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.validate.upstream_sha }}
          BASE_SHA: ${{ needs.validate.base_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPSTREAM_COMMITS_FILE: ${{ runner.temp }}/upstream-sync-result/upstream-commits.md
          UPSTREAM_FILES_FILE: ${{ runner.temp }}/upstream-sync-result/upstream-files.md
          MERGE_OUTCOME: success
          INSTALL_OUTCOME: ${{ needs.validate.install_outcome }}
          UNIT_OUTCOME: ${{ needs.validate.unit_outcome }}
          JP_OUTCOME: ${{ needs.validate.jp_outcome }}
          YOSTAR_OUTCOME: ${{ needs.validate.yostar_outcome }}
          PROTOCOL_OUTCOME: ${{ needs.validate.protocol_outcome }}
        shell: bash
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/upstream-pr-body.md"
          node scripts/upstream-sync-report.js pr > "${body_file}"
          short_sha="${UPSTREAM_SHA:0:12}"
          title="[업스트림] 원본 업데이트 검토 (${short_sha})"
          pr_number="$(gh pr list \
            --state open \
            --head "${SYNC_BRANCH}" \
            --base main \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "${pr_number}" ]]; then
            gh pr edit "${pr_number}" --title "${title}" --body-file "${body_file}"
            pr_url="$(gh pr view "${pr_number}" --json url --jq .url)"
          else
            pr_url="$(gh pr create \
              --draft \
              --head "${SYNC_BRANCH}" \
              --base main \
              --title "${title}" \
              --body-file "${body_file}")"
          fi

          echo "url=${pr_url}" >> "${GITHUB_OUTPUT}"

      - name: Publish candidate validation status
        if: >-
          needs.validate.has_updates == 'true' &&
          needs.validate.merge_result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.validate.candidate_sha }}
          STATUS_STATE: ${{ steps.status.outputs.state }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          description='Upstream merge and validation completed'
          if [[ "${STATUS_STATE}" != 'success' ]]; then
            description='Upstream candidate requires manual fixes'
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${CANDIDATE_SHA}" \
            -f state="${STATUS_STATE}" \
            -f context='upstream-sync/validation' \
            -f description="${description}" \
            -f target_url="${RUN_URL}"

      - name: Create or update upstream sync incident
        if: >-
          needs.validate.has_updates == 'true' &&
          steps.status.outputs.state == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ needs.validate.upstream_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_URL: ${{ steps.pr.outputs.url }}
          SYNC_REASON: ${{ steps.status.outputs.reason }}
          UPSTREAM_COMMITS_FILE: ${{ runner.temp }}/upstream-sync-result/upstream-commits.md
          UPSTREAM_FILES_FILE: ${{ runner.temp }}/upstream-sync-result/upstream-files.md
          CONFLICT_FILES_FILE: ${{ runner.temp }}/upstream-sync-result/conflict-files.md
          MERGE_OUTCOME: ${{ needs.validate.merge_result == 'success' && 'success' || 'failure' }}
          INSTALL_OUTCOME: ${{ needs.validate.install_outcome }}
          UNIT_OUTCOME: ${{ needs.validate.unit_outcome }}
          JP_OUTCOME: ${{ needs.validate.jp_outcome }}
          YOSTAR_OUTCOME: ${{ needs.validate.yostar_outcome }}
          PROTOCOL_OUTCOME: ${{ needs.validate.protocol_outcome }}
        shell: bash
        run: |
          set -euo pipefail
          title='[업스트림 동기화] 수동 확인 필요'
          body_file="${RUNNER_TEMP}/upstream-issue-body.md"
          node scripts/upstream-sync-report.js issue > "${body_file}"
          issue_number="$(gh issue list \
            --state open \
            --search "\"${title}\" in:title" \
            --json number \
            --jq '.[0].number // empty')"

          if [[ -n "${issue_number}" ]]; then
            gh issue comment "${issue_number}" --body-file "${body_file}"
          else
            gh issue create --title "${title}" --body-file "${body_file}"
          fi

      - name: Close resolved upstream sync incident
        if: >-
          needs.validate.has_updates != 'true' ||
          steps.status.outputs.state == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_URL: ${{ steps.pr.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          title='[업스트림 동기화] 수동 확인 필요'
          issue_number="$(gh issue list \
            --state open \
            --search "\"${title}\" in:title" \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -z "${issue_number}" ]]; then
            exit 0
          fi

          recovery_file="${RUNNER_TEMP}/upstream-recovery.md"
          {
            echo '업스트림 동기화 검사가 다시 정상 상태가 되었습니다.'
            echo
            echo "- Actions: ${RUN_URL}"
            if [[ -n "${PR_URL}" ]]; then
              echo "- 초안 PR: ${PR_URL}"
            fi
          } > "${recovery_file}"
          gh issue comment "${issue_number}" --body-file "${recovery_file}"
          gh issue close "${issue_number}" --reason completed

      - name: Fail workflow when manual intervention is required
        if: >-
          needs.validate.has_updates == 'true' &&
          steps.status.outputs.state == 'failure'
        run: exit 1
