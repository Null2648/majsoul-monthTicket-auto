name: Attendance Early Backup
run-name: >-
  Attendance Early Backup · ${{ github.event_name }} · ${{ github.ref_name }}

on:
  schedule:
    - cron: '47,57 5 * * *'
      timezone: 'Asia/Seoul'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/attendance-early-backup.yml'
      - 'src/attendance-schedule.js'
      - 'src/websocket-hardening.js'
      - 'scripts/preflight-attendance.js'
      - 'scripts/write-attendance-run-report.js'
      - 'scripts/report-automation-status.js'
      - 'test/attendance-schedule.test.js'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/attendance-early-backup.yml'
      - 'src/attendance-schedule.js'
      - 'src/websocket-hardening.js'
      - 'scripts/preflight-attendance.js'
      - 'scripts/write-attendance-run-report.js'
      - 'scripts/report-automation-status.js'
      - 'test/attendance-schedule.test.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify early scheduler and safety window
        run: node --test test/attendance-schedule.test.js test/full-review-hardening.test.js

  attendance:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: majsoul-attendance
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout trusted main branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Decide whether attendance is safe and needed
        id: decision
        shell: bash
        env:
          ATTENDANCE_SCHEDULE: ${{ github.event.schedule }}
          ATTENDANCE_FORCE: false
          ATTENDANCE_CONFIRM_SAFE_LOGIN: false
          ATTENDANCE_SOURCE: schedule
        run: |
          set -euo pipefail
          marker="${RUNNER_TEMP}/last-attendance-kst.txt"
          git fetch origin main:refs/remotes/origin/main --quiet
          git show refs/remotes/origin/main:last-attendance-kst.txt > "${marker}" 2>/dev/null || :
          node src/attendance-schedule.js "${marker}"

      - name: Validate attendance configuration
        id: preflight
        if: steps.decision.outputs.should_run == 'true'
        run: node scripts/preflight-attendance.js
        env:
          MAJSOUL_UID: ${{ secrets.UID }}
          MAJSOUL_TOKEN: ${{ secrets.TOKEN }}
          MAJSOUL_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          MAJSOUL_YOSTAR_DEVICE_ID: ${{ secrets.YOSTAR_DEVICE_ID }}
          MAJSOUL_EMAIL: ${{ secrets.EMAIL }}
          MAJSOUL_PASSWORD: ${{ secrets.PASSWORD }}
          MS_SERVER: ${{ secrets.MS_SERVER }}

      - name: Install runtime dependencies
        id: install
        if: steps.decision.outputs.should_run == 'true' && steps.preflight.outcome == 'success'
        run: npm ci --omit=dev --ignore-scripts

      - name: Execute month ticket automation
        id: automation
        if: >-
          steps.decision.outputs.should_run == 'true' &&
          steps.preflight.outcome == 'success' &&
          steps.install.outcome == 'success'
        run: npm start
        env:
          UID: ${{ secrets.UID }}
          TOKEN: ${{ secrets.TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          YOSTAR_DEVICE_ID: ${{ secrets.YOSTAR_DEVICE_ID }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          MS_SERVER: ${{ secrets.MS_SERVER }}

      - name: Update successful attendance state
        id: cache
        if: success() && steps.decision.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Last run: $(date --iso-8601=seconds)" > keep_alive.txt
          TZ=Asia/Seoul date +%F > last-attendance-kst.txt

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add keep_alive.txt last-attendance-kst.txt resource-version.json auth-cache.json protocol-snapshot.json
          git diff --cached --quiet || git commit -m 'Update runtime cache [skip ci]'

          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth}"
          trap 'git config --local --unset-all http.https://github.com/.extraheader 2>/dev/null || true' EXIT
          git pull --rebase origin main
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Write attendance run report
        if: always()
        run: node scripts/write-attendance-run-report.js
        env:
          JOB_STATUS: ${{ job.status }}
          DECISION_OUTCOME: ${{ steps.decision.outcome }}
          SHOULD_RUN: ${{ steps.decision.outputs.should_run }}
          DECISION_REASON: ${{ steps.decision.outputs.reason }}
          ATTENDANCE_STAGE: ${{ steps.decision.outputs.stage }}
          ATTENDANCE_SOURCE: schedule
          ATTENDANCE_TODAY: ${{ steps.decision.outputs.today }}
          LAST_SUCCESS: ${{ steps.decision.outputs.last_success }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          AUTOMATION_OUTCOME: ${{ steps.automation.outcome }}
          CACHE_OUTCOME: ${{ steps.cache.outcome }}

      - name: Upload failed run diagnostics
        if: always() && job.status != 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: early-attendance-diagnostics-${{ github.run_id }}
          path: |
            attendance-run-report.json
            automation-failure-report.json
            protocol-change-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Report automation status
        if: >-
          always() &&
          (steps.decision.outputs.should_run == 'true' || steps.decision.outcome == 'failure')
        continue-on-error: true
        run: node scripts/report-automation-status.js
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TESTS_OUTCOME: skipped
          JP_OUTCOME: skipped
          YOSTAR_OUTCOME: skipped
          PROTOCOL_OUTCOME: skipped
          AUTOMATION_OUTCOME: ${{ steps.automation.outcome }}
          CACHE_OUTCOME: ${{ steps.cache.outcome }}
          ATTENDANCE_STAGE: ${{ steps.decision.outputs.stage }}
          ATTENDANCE_SOURCE: schedule
